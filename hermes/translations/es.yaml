# Nombres y descripciones de las opciones en la página de configuración de la
# app. El Supervisor lee este fichero junto a config.yaml;
# tests/test_translations.py comprueba que las claves son las del esquema, una
# a una. Detalle completo: DOCS.md.
configuration:
  auth_password:
    name: "Contraseña de autorización"
    description: "La contraseña que escribes al autorizar a Claude. Mínimo 12 caracteres y que no sea adivinable: Hermes no arranca con una débil. Es el único secreto que protege tu casa."
  public_hostname:
    name: "Hostname público"
    description: "El hostname público por el que se llega a Hermes, sin https:// y sin path. Si no se sirve en el 443, con el puerto (host:8443)."
  network_mode:
    name: "Modo de red"
    description: "Quién publica el hostname: tailscale (Tailscale Funnel) o reverse_proxy (Cloudflare Tunnel, Nginx, Caddy u otro proxy)."
  mcp_bind:
    name: "Dirección de escucha"
    description: "Dirección donde escucha Hermes. La de por defecto, loopback, sirve con Tailscale Funnel; usa la dirección de la red puente de HAOS si tu proxy corre en esa red."
  trusted_proxy_ips:
    name: "Proxies de confianza"
    description: "Proxies cuya cabecera X-Forwarded-For se cree, como IPs sueltas o rangos CIDR. Vacía, solo se confía en loopback, y con reverse_proxy todos los límites por IP pasan a ser uno global. Quien esté dentro de un rango de confianza puede falsificar la IP del cliente (solo afecta a límites y logs, nunca a la autorización)."
  log_level:
    name: "Nivel de log"
    description: "Nivel de log: debug, info, warning o error."
  mcp_max_requests_per_minute:
    name: "Peticiones por minuto"
    description: "Límite global de peticiones autenticadas."
  mcp_preauth_max_requests_per_minute_per_ip:
    name: "Peticiones sin autenticar por minuto e IP"
    description: "Límite por IP de la superficie pública (OAuth y discovery) y de las peticiones a rutas protegidas que llegan sin token o con uno inválido."
  safety_backup_enabled:
    name: "Backup de seguridad antes de escribir"
    description: "Backup completo automático antes de escribir en /config. Desactivado por defecto porque ocupa varios GB; el backup por fichero se hace siempre. Si el backup falla, o Hermes no puede saber si terminó, la escritura no se hace."
  safety_backup_window_minutes:
    name: "Ventana del backup de seguridad (minutos)"
    description: "Si Hermes hizo su propio backup de seguridad hace menos de esto, no hace otro. Los backups hechos a mano o por otras herramientas no cuentan."
  safety_backup_keep:
    name: "Backups de seguridad que se conservan"
    description: "Backups de seguridad automáticos que se conservan tras cada uno correcto (0 desactiva la retención). Solo se borran los que Hermes anotó al crearlos, nunca uno tuyo. Solo actúa con el backup de seguridad activado."
  file_backup_max_per_path:
    name: "Copias por fichero"
    description: "Copias que se guardan de cada fichero antes de sobrescribirlo."
  file_backup_max_total_mb:
    name: "Tamaño de las copias por fichero (MB)"
    description: "Tope total, en MB, del directorio de copias por fichero."
  config_write_min_interval_seconds:
    name: "Segundos entre escrituras"
    description: "Segundos mínimos entre dos escrituras en /config."
  config_write_max_per_minute:
    name: "Escrituras por minuto"
    description: "Escrituras máximas por minuto en /config."
  response_max_bytes:
    name: "Tamaño máximo de respuesta (bytes)"
    description: "Tope de la respuesta de cualquier tool (128 KiB por defecto); por encima se recorta y se marca con truncated. Máximo efectivo 512 KiB: un valor mayor se recorta."
  ha_ws_max_msg_size_bytes:
    name: "Mensaje máximo de Home Assistant (bytes)"
    description: "Tope de un mensaje de la WebSocket con Home Assistant (16 MiB). Uno mayor cierra la conexión entera, no solo esa llamada. Bájalo solo si la memoria es muy justa."
  max_request_body_bytes:
    name: "Cuerpo máximo de petición (bytes)"
    description: "Tope del cuerpo de una petición HTTP autenticada (4 MB). Los endpoints públicos de OAuth tienen su propio tope fijo."
  max_concurrent_requests:
    name: "Peticiones simultáneas"
    description: "Peticiones simultáneas que acepta el servidor. Acota la memoria en vuelo; Claude lanza ráfagas de unas 24 llamadas, así que 64 deja holgura."
  wait_for_event_max_seconds:
    name: "Espera máxima de eventos (segundos)"
    description: "Espera más larga que admite ha_wait_for_event (de 10 a 220; un valor mayor se recorta)."
  wait_for_event_max_concurrent:
    name: "Esperas de eventos simultáneas"
    description: "Máximo de llamadas a ha_wait_for_event a la vez (de 1 a 20)."
  health_startup_grace_seconds:
    name: "Margen de arranque por paso (segundos)"
    description: "Margen de arranque de cada paso, no total: los pasos de Tailscale, de la información de Core y de la WebSocket de Home Assistant pueden usarlo entero cada uno."
  health_reconnect_tolerance_seconds:
    name: "Tolerancia de reconexión (segundos)"
    description: "Cuánto puede estar caída la WebSocket con Home Assistant antes de que la comprobación de salud diga degraded_long en vez de degraded."
  call_service_denylist_extra:
    name: "Servicios extra que piden confirmación"
    description: "Servicios que exigirán confirmación explícita, además de los que ya trae Hermes, escritos como dominio punto servicio. Admite comodín (shell_command.*)."
  call_service_restricted_entities:
    name: "Entidades que piden confirmación"
    description: "Entidades concretas que exigirán confirmación aunque el servicio no esté en la lista."
  call_service_auto_classify_dangerous:
    name: "Clasificar scripts peligrosos automáticamente"
    description: "Al arrancar y tras recargar scripts o automatizaciones desde Hermes, Hermes lee tus scripts y automatizaciones y marca como restringidos los que llaman a servicios peligrosos (la lista de serie más call_service_denylist_extra). Desactivarla solo apaga esas dos revisiones: los scripts y automatizaciones que se guardan desde Hermes se revisan siempre y se restringen si son peligrosos, aunque la opción esté desactivada."
  fire_event_allowlist:
    name: "Eventos que se pueden disparar"
    description: "Tipos de evento que ha_fire_event puede disparar. Vacía, la tool está desactivada: hay que nombrar cada evento permitido."
  oauth_cimd_enabled:
    name: "Aceptar clientes CIMD"
    description: "Acepta clientes que se identifican con una URL de metadatos (CIMD), como Claude Code. Desactívala solo si un cliente falla con CIMD: el registro dinámico (DCR) sigue funcionando."
  oauth_cimd_allowed_hosts:
    name: "Hosts CIMD permitidos"
    description: "Hosts cuyos documentos CIMD acepta Hermes (por ejemplo claude.ai). Vacía significa cualquier host público: cada descarga sale de la IP de tu casa hacia un host que cualquiera puede elegir sin la contraseña. Pon solo los hosts que uses."
  log_redact_network:
    name: "Ocultar datos de red en el log"
    description: "Sustituye en el log tu hostname público, las URL de Home Assistant, los nombres de Tailscale y las IPs que no son de loopback por marcadores, para que puedas pegarlo al pedir ayuda. Los secretos se redactan siempre."
  tool_families_disabled:
    name: "Familias de tools desactivadas"
    description: "Familias de tools que Hermes no registra, para que el cliente cargue menos (por ejemplo lovelace o marketplace). Vacía, están todas. base no se puede desactivar, y un nombre desconocido impide arrancar la app."

[pytest]
# Sin esto la suite solo se puede lanzar como `python -m pytest`, que mete el
# directorio actual en sys.path por su cuenta. Con el ejecutable `pytest` a
# secas —que es como lo lanza cualquier CI— 26 de los 46 ficheros fallan al
# recolectar: hacen `from tests._ha_fixture import ...` y la raíz del repo no
# está en la ruta de importación.
#
# `pythonpath` lo resuelve para las dos formas de lanzarlo, y de paso hace
# innecesario exportar PYTHONPATH=src a mano.
pythonpath = hermes/src .
testpaths = tests

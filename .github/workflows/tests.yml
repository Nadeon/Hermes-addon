name: Tests

# Hasta ahora el único workflow era el de análisis estático: la suite no se
# ejecutaba en ninguna parte salvo en la máquina de quien programa. Eso importa
# más de lo que parece, porque hay tests que se saltan en Windows —los de
# escape por symlink, que dependen de `O_NOFOLLOW`— y son justo los que cubren
# uno de los caminos de traversal. En Linux sí corren.

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

jobs:
  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 es la del add-on (ver build.yaml); 3.12 como red por si algo
        # depende de una versión concreta sin decirlo.
        python: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r hermes/requirements.txt
          pip install pytest pytest-asyncio pytest-cov aioresponses httpx

      - name: Preparar la comprobación de escrituras fuera del árbol
        run: |
          # Hermes guarda su estado en /data. En el runner ese directorio no
          # existe, así que hay que crearlo: si no, la comprobación de abajo
          # pasaría siempre sin comprobar nada.
          sudo mkdir -p /data && sudo chmod 777 /data

      - name: Ejecutar la suite
        env:
          # PYTHONPATH no hace falta: lo fija pytest.ini. La suite redirige por
          # su cuenta todo lo que escribe a un tmpdir (ver tests/conftest.py);
          # esto solo fija la raíz de configuración.
          HERMES_CONFIG_BASE: ${{ runner.temp }}/hermes_config
        run: pytest -q

      - name: La suite no debe escribir fuera del árbol
        run: |
          if [ -n "$(ls -A /data 2>/dev/null)" ]; then
            echo "La suite ha escrito en /data. Debe aislarse en tests/conftest.py." >&2
            ls -la /data >&2
            exit 1
          fi
          echo "Sin escrituras fuera del árbol."

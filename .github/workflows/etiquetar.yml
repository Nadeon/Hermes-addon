name: Etiquetar versión

# Crea la etiqueta `v<version>` sobre la rama elegida y la release de GitHub
# con las notas del CHANGELOG, desde GitHub, sin necesidad de un clon a mano.
# Antes comprueba que la versión coincide con `version:` en hermes/config.yaml
# (una etiqueta que el manifiesto no declara es una que el Supervisor nunca
# pedirá).
#
# Es idempotente: si la etiqueta ya existe, no la toca (una etiqueta no se
# mueve; si hay que corregir algo, es una versión nueva) y solo comprueba
# que el manifiesto del commit etiquetado declara esa versión; si la
# release ya existe, no la duplica. Así sirve también para crear la release
# de una versión ya etiquetada, a mano o por una versión anterior de este
# workflow que solo etiquetaba, aunque la rama haya avanzado desde entonces.
# Las notas salen del CHANGELOG de la rama elegida, que las tiene todas.
#
# IMPORTANTE: una etiqueta subida con GITHUB_TOKEN no dispara otros
# workflows, por diseño de GitHub Actions. Este workflow NO publica las
# imágenes. Para publicarlas hay que lanzar "Publicar imagen" a mano con la
# misma versión, o subir la etiqueta desde un clon propio, que sí la dispara.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a etiquetar (sin la v); debe coincidir con hermes/config.yaml"
        required: true

permissions:
  contents: write

jobs:
  etiquetar:
    name: Crear v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar y etiquetar
        env:
          # Por variable de entorno, no interpolado en el script: así el
          # valor no puede convertirse en código del shell.
          VERSION: ${{ inputs.version }}
        run: |
          # Una etiqueta anotada apunta a un objeto tag; "^{}" da el commit.
          # Una ligera (las de las primeras versiones) apunta al commit.
          EXISTENTE=$(git ls-remote --tags origin "refs/tags/v$VERSION^{}" | cut -f1)
          [ -n "$EXISTENTE" ] || EXISTENTE=$(git ls-remote --tags origin "refs/tags/v$VERSION" | cut -f1)
          if [ -n "$EXISTENTE" ]; then
            # La etiqueta no se mueve. Se comprueba el manifiesto del commit
            # etiquetado, no el de la rama: la rama puede haber avanzado a
            # otra versión y este workflow se lanza también para crear la
            # release de una versión ya etiquetada.
            git fetch --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            MANIFIESTO=$(git show "v$VERSION:hermes/config.yaml" | grep -Po '^version:\s*"\K[^"]+')
            echo "version=$VERSION  manifiesto en v$VERSION=$MANIFIESTO"
            if [ "$VERSION" != "$MANIFIESTO" ]; then
              echo "La etiqueta v$VERSION apunta a un commit cuyo hermes/config.yaml dice $MANIFIESTO." >&2
              exit 1
            fi
            echo "La etiqueta v$VERSION ya existe sobre ${EXISTENTE:0:7}; no se toca."
            exit 0
          fi
          MANIFIESTO=$(grep -Po '^version:\s*"\K[^"]+' hermes/config.yaml)
          echo "version=$VERSION  manifiesto=$MANIFIESTO"
          if [ "$VERSION" != "$MANIFIESTO" ]; then
            echo "La versión ($VERSION) no coincide con hermes/config.yaml ($MANIFIESTO)." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Hermes $VERSION"
          git push origin "refs/tags/v$VERSION"
          echo "Etiqueta v$VERSION creada sobre $(git rev-parse --short HEAD)."

      - name: Crear la release con las notas del CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" --json tagName >/dev/null 2>&1; then
            echo "La release v$VERSION ya existe; no se duplica."
            exit 0
          fi
          # La sección es desde "## [<version>]" hasta el siguiente "## ",
          # sin la cabecera: el mismo texto que las releases hechas a mano.
          awk -v v="$VERSION" '
            /^## \[/ { dentro = (index($0, "## [" v "]") == 1); if (dentro) next }
            dentro { print }
          ' hermes/CHANGELOG.md > /tmp/notas.md
          if ! grep -q '[^[:space:]]' /tmp/notas.md; then
            echo "hermes/CHANGELOG.md no tiene sección para la $VERSION." >&2
            exit 1
          fi
          gh release create "v$VERSION" --title "Hermes $VERSION" --notes-file /tmp/notas.md --latest
          echo "Release v$VERSION creada."
